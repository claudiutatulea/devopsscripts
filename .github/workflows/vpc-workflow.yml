name: VPC Tutorial


on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Operation to run: plan, apply, or destroy"
        required: true
        default: "plan"
      create_https_listener:
        description: "Create HTTPS listener (true/false). Requires ACM DNS validation."
        required: false
        default: "false"

env:
  TF_DIR: terraform/vpc

jobs:
  plan:
    name: Plan VPC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"
      - name: Terraform init
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_STATE_REGION: ${{ secrets.TF_STATE_REGION }}
          TF_STATE_TABLE: ${{ secrets.TF_STATE_TABLE }}
        run: |
          terraform -chdir=${{ env.TF_DIR }} init \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="key=vpc/terraform.tfstate" \
            -backend-config="region=${{ env.TF_STATE_REGION }}" \
            -backend-config="dynamodb_table=${{ env.TF_STATE_TABLE }}" \
            -input=false
      - name: Terraform plan
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: |
          terraform -chdir=${{ env.TF_DIR }} plan \
            -var-file=../envs/vpc-development.tfvars \
            -var="create_https_listener=${{ github.event.inputs.create_https_listener }}" \
            -out=tfplan -input=false
      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: vpc-tfplan
          path: ${{ env.TF_DIR }}/tfplan

  apply:
    name: Apply VPC
    needs: plan
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.operation == 'apply' }}
    environment: development
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"
      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: vpc-tfplan
          path: ${{ env.TF_DIR }}
      - name: Terraform init
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_STATE_REGION: ${{ secrets.TF_STATE_REGION }}
          TF_STATE_TABLE: ${{ secrets.TF_STATE_TABLE }}
        run: |
          terraform -chdir=${{ env.TF_DIR }} init \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="key=vpc/terraform.tfstate" \
            -backend-config="region=${{ env.TF_STATE_REGION }}" \
            -backend-config="dynamodb_table=${{ env.TF_STATE_TABLE }}" \
            -input=false
      - name: Terraform apply
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: terraform -chdir=${{ env.TF_DIR }} apply -input=false -auto-approve tfplan

      - name: Export Terraform state
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: terraform -chdir=${{ env.TF_DIR }} state pull > ${{ env.TF_DIR }}/vpc.tfstate.json || true

      - name: Upload state artifact
        uses: actions/upload-artifact@v4
        with:
          name: vpc-tfstate
          path: ${{ env.TF_DIR }}/vpc.tfstate.json

      - name: Export Terraform outputs
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: terraform -chdir=${{ env.TF_DIR }} output -json > ${{ env.TF_DIR }}/outputs.json || true

      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: vpc-outputs
          path: ${{ env.TF_DIR }}/outputs.json

      - name: Smoke test (HTTP)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: |
          alb=$(terraform -chdir=${{ env.TF_DIR }} output -raw alb_dns_name)
          echo "ALB DNS: $alb"

          status=""
          for i in $(seq 1 30); do
            status=$(curl -sS -o /dev/null -w "%{http_code}" "http://$alb/" || true)
            echo "Attempt $i: HTTP status: $status"
            if [ "$status" = "200" ]; then
              echo "Smoke test passed"
              exit 0
            fi
            sleep 10
          done

          echo "Smoke test failed: HTTP $status after retries"
          exit 1

  destroy:
    name: Destroy VPC
    needs: plan
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.operation == 'destroy' }}
    environment: development
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"
      - name: Terraform init
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_STATE_REGION: ${{ secrets.TF_STATE_REGION }}
          TF_STATE_TABLE: ${{ secrets.TF_STATE_TABLE }}
        run: |
          terraform -chdir=${{ env.TF_DIR }} init \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="key=vpc/terraform.tfstate" \
            -backend-config="region=${{ env.TF_STATE_REGION }}" \
            -backend-config="dynamodb_table=${{ env.TF_STATE_TABLE }}" \
            -input=false
      - name: Terraform destroy (plan + apply)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: |
          terraform -chdir=${{ env.TF_DIR }} plan -destroy -var-file=../envs/vpc-development.tfvars -out=tfplan -input=false
          terraform -chdir=${{ env.TF_DIR }} apply -input=false -auto-approve tfplan

      - name: Export Terraform state
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: terraform -chdir=${{ env.TF_DIR }} state pull > vpc.tfstate.json || true

      - name: Upload state artifact
        uses: actions/upload-artifact@v4
        with:
          name: vpc-tfstate
          path: ${{ env.TF_DIR }}/vpc.tfstate.json
